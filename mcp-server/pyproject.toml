[project]
name = "mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "markdownify>=0.13.1",
    "mcp[cli]>=2.0.0",
    "protego>=0.3.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "readabilipy>=0.2.0",
    "requests>=2.32.3",
]

[project.scripts]
mcp-server = "mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    # readabilipy's own internal use of BeautifulSoup's deprecated findAll,
    # not something this project's code calls.
    "ignore:Call to deprecated method findAll.*:DeprecationWarning",
]
